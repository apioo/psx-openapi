{"./spec/typeschema.json":{"definitions":{"Callback":{"description":"A map of possible out-of band callbacks related to the parent operation. Each value in the map is a Path Item Object that describes a set of requests that may be initiated by the API provider and the expected responses. The key value used to identify the Path Item Object is an expression, evaluated at runtime, that identifies a URL to use for the callback operation.  To describe incoming requests from the API provider independent from another API call, use the `webhooks` field.","type":"object","additionalProperties":{"$ref":"PathItem"}},"Callbacks":{"description":"A map of possible out-of band callbacks related to the parent operation. The key is a unique identifier for the Callback Object.","type":"object","additionalProperties":{"$ref":"Callback"}},"Webhooks":{"description":"The incoming webhooks that MAY be received as part of this API and that the API consumer MAY choose to implement. The key name is a unique string to refer to each webhook, while the (optionally referenced) Path Item Object describes a request that may be initiated by the API provider and the expected responses.","type":"object","additionalProperties":{"$ref":"PathItem"}},"Components":{"description":"Holds a set of reusable objects for different aspects of the OAS. All objects defined within the Components Object will have no effect on the API unless they are explicitly referenced from outside the Components Object.","type":"object","properties":{"schemas":{"$ref":"Schemas"},"responses":{"$ref":"Responses"},"parameters":{"$ref":"Parameters"},"examples":{"$ref":"Examples"},"requestBodies":{"$ref":"RequestBodies"},"headers":{"$ref":"Headers"},"securitySchemes":{"$ref":"SecuritySchemes"},"links":{"$ref":"Links"},"callbacks":{"$ref":"Callbacks"}}},"Contact":{"description":"Contact information for the exposed API.","type":"object","properties":{"name":{"type":"string"},"url":{"type":"string"},"email":{"type":"string"}}},"Encoding":{"description":"A single encoding definition applied to a single schema property.  Properties are correlated with `multipart` parts using the `name` parameter of `Content-Disposition: form-data`, and with `application/x-www-form-urlencoded` using the query string parameter names. In both cases, their order is implementation-defined.","type":"object","properties":{"contentType":{"type":"string"},"headers":{"$ref":"Headers"},"style":{"type":"string"},"explode":{"type":"boolean"},"allowReserved":{"type":"boolean"}}},"Encodings":{"description":"A map between a property name and its encoding information. The key, being the property name, MUST exist in the schema as a property.","type":"object","additionalProperties":{"$ref":"Encoding"}},"Example":{"description":"An object grouping an internal or external example value with basic `summary` and `description` metadata. This object is typically used in fields named `examples` (plural), and is a referenceable alternative to older `example` (singular) fields that do not support referencing or metadata.  Examples allow demonstration of the usage of properties, parameters and objects within OpenAPI.","type":"object","properties":{"summary":{"type":"string"},"description":{"type":"string"},"value":{"type":"any"},"externalValue":{"type":"string"}}},"ExternalDocs":{"description":"Allows referencing an external resource for extended documentation.","type":"object","properties":{"description":{"type":"string"},"url":{"type":"string"}}},"Header":{"description":"Describes a single header for HTTP responses and for individual parts in `multipart` representations.  The Header Object follows the structure of the Parameter Object, including determining its serialization strategy based on whether `schema` or `content` is present, with the following changes:  1. `name` MUST NOT be specified, it is given in the corresponding `headers` map. 1. `in` MUST NOT be specified, it is implicitly in `header`. 1. All traits that are affected by the location MUST be applicable to a location of `header` (for example, `style`). This means that `allowEmptyValue` and `allowReserved` MUST NOT be used, and `style`, if used, MUST be limited to `\"simple\"`.","type":"object","properties":{"description":{"type":"string"},"required":{"type":"boolean"},"deprecated":{"type":"boolean"},"style":{"type":"string"},"explode":{"type":"boolean"},"schema":{"type":"any"},"example":{"type":"any"},"examples":{"$ref":"Examples"},"content":{"$ref":"MediaTypes"}}},"Headers":{"description":"A map of Header Objects, the key is the name of the header.","type":"object","additionalProperties":{"$ref":"Header"}},"Info":{"description":"The object provides metadata about the API. The metadata MAY be used by the clients if needed, and MAY be presented in editing or documentation generation tools for convenience.","type":"object","properties":{"title":{"type":"string"},"summary":{"type":"string"},"description":{"type":"string"},"termsOfService":{"type":"string"},"contact":{"$ref":"Contact"},"license":{"$ref":"License"},"version":{"type":"string"}}},"License":{"description":"License information for the exposed API.","type":"object","properties":{"name":{"type":"string"},"identifier":{"type":"string"},"url":{"type":"string"}}},"Link":{"description":"The Link Object represents a possible design-time link for a response. The presence of a link does not guarantee the caller's ability to successfully invoke it, rather it provides a known relationship and traversal mechanism between responses and other operations.  Unlike _dynamic_ links (i.e. links provided **in** the response payload), the OAS linking mechanism does not require link information in the runtime response.  For computing links and providing instructions to execute them, a runtime expression is used for accessing values in an operation and using them as parameters while invoking the linked operation.","type":"object","properties":{"operationRef":{"type":"string"},"operationId":{"type":"string"},"description":{"type":"string"},"server":{"$ref":"Server"}}},"Links":{"description":"A map of Link Objects, the key is a short name for the link.","type":"object","additionalProperties":{"$ref":"Link"}},"MediaType":{"description":"Each Media Type Object provides schema and examples for the media type identified by its key.  When `example` or `examples` are provided, the example SHOULD match the specified schema and be in the correct format as specified by the media type and its encoding. The `example` and `examples` fields are mutually exclusive, and if either is present it SHALL override any `example` in the schema.","type":"object","properties":{"schema":{"type":"any"},"example":{"type":"any"},"examples":{"$ref":"Examples"},"encoding":{"$ref":"Encodings"}}},"MediaTypes":{"description":"A map containing descriptions of potential payloads. The key is a media type or media type range and the value describes it.","type":"object","additionalProperties":{"$ref":"MediaType"}},"OAuthFlow":{"description":"Configuration details for a supported OAuth Flow.","type":"object","properties":{"authorizationUrl":{"type":"string"},"tokenUrl":{"type":"string"},"refreshUrl":{"type":"string"},"scopes":{"$ref":"Scopes"}}},"OAuthFlows":{"description":"Allows configuration of the supported OAuth Flows.","type":"object","properties":{"implicit":{"$ref":"OAuthFlow"},"password":{"$ref":"OAuthFlow"},"clientCredentials":{"$ref":"OAuthFlow"},"authorizationCode":{"$ref":"OAuthFlow"}}},"OpenAPI":{"description":"This is the root object of the OpenAPI Description.","type":"object","properties":{"openapi":{"default":"3.1.2","type":"string"},"info":{"$ref":"Info"},"jsonSchemaDialect":{"type":"string"},"servers":{"type":"array","items":{"$ref":"Server"}},"paths":{"$ref":"Paths"},"webhooks":{"$ref":"Webhooks"},"components":{"$ref":"Components"},"security":{"type":"array","items":{"$ref":"SecurityRequirement"}},"tags":{"type":"array","items":{"$ref":"Tag"}},"externalDocs":{"$ref":"ExternalDocs"}}},"Operation":{"description":"Describes a single API operation on a path.","type":"object","properties":{"tags":{"type":"array","items":{"type":"string"}},"summary":{"type":"string"},"description":{"type":"string"},"externalDocs":{"$ref":"ExternalDocs"},"operationId":{"type":"string"},"parameters":{"type":"array","items":{"$ref":"Parameter"}},"requestBody":{"$ref":"RequestBody"},"responses":{"$ref":"Responses"},"callbacks":{"$ref":"Callbacks"},"deprecated":{"type":"boolean"},"security":{"type":"array","items":{"$ref":"SecurityRequirement"}},"servers":{"type":"array","items":{"$ref":"Server"}}}},"Parameters":{"description":"An object to hold reusable Parameter Objects.","type":"object","additionalProperties":{"$ref":"Parameter"}},"Parameter":{"description":"Describes a single operation parameter.  A unique parameter is defined by a combination of a name and location.","type":"object","properties":{"name":{"type":"string"},"in":{"type":"string"},"description":{"type":"string"},"required":{"type":"boolean"},"deprecated":{"type":"boolean"},"allowEmptyValue":{"type":"boolean"},"style":{"type":"string"},"explode":{"type":"boolean"},"allowReserved":{"type":"boolean"},"schema":{"type":"any"},"example":{"type":"any"},"examples":{"$ref":"Examples"},"content":{"$ref":"MediaTypes"}}},"Examples":{"description":"A map of Example Objects.","type":"object","additionalProperties":{"$ref":"Example"}},"PathItem":{"description":"Describes the operations available on a single path. A Path Item MAY be empty, due to ACL constraints. The path itself is still exposed to the documentation viewer but they will not know which operations and parameters are available.","type":"object","properties":{"$ref":{"type":"string"},"summary":{"type":"string"},"description":{"type":"string"},"get":{"$ref":"Operation"},"put":{"$ref":"Operation"},"post":{"$ref":"Operation"},"delete":{"$ref":"Operation"},"options":{"$ref":"Operation"},"head":{"$ref":"Operation"},"patch":{"$ref":"Operation"},"trace":{"$ref":"Operation"},"servers":{"type":"array","items":{"$ref":"Server"}},"parameters":{"type":"array","items":{"$ref":"Parameter"}}}},"Paths":{"description":"Holds the relative paths to the individual endpoints and their operations. The path is appended to the URL from the Server Object in order to construct the full URL. The Paths Object MAY be empty, due to Access Control List (ACL) constraints.","type":"object","additionalProperties":{"$ref":"PathItem"}},"Reference":{"description":"A simple object to allow referencing other components in the OpenAPI Description, internally and externally.  The `$ref` string value contains a URI (RFC3986), which identifies the value being referenced.","type":"object","properties":{"$ref":{"type":"string"},"summary":{"type":"string"},"description":{"type":"string"}}},"RequestBody":{"description":"Describes a single request body.","type":"object","properties":{"description":{"type":"string"},"content":{"$ref":"MediaTypes"},"required":{"type":"boolean"}}},"RequestBodies":{"description":"An object to hold reusable Request Body Objects.","type":"object","additionalProperties":{"$ref":"RequestBody"}},"Response":{"description":"Describes a single response from an API operation, including design-time, static `links` to operations based on the response.","type":"object","properties":{"description":{"type":"string"},"headers":{"$ref":"Headers"},"content":{"$ref":"MediaTypes"},"links":{"type":"map","schema":{"$ref":"Link"}}}},"Responses":{"description":"A container for the expected responses of an operation. The container maps a HTTP response code to the expected response.  The documentation is not necessarily expected to cover all possible HTTP response codes because they may not be known in advance. However, documentation is expected to cover a successful operation response and any known errors.  The `default` MAY be used as a default Response Object for all HTTP codes that are not covered individually by the Responses Object.  The Responses Object MUST contain at least one response code, and if only one response code is provided it SHOULD be the response for a successful operation call.","type":"object","additionalProperties":{"$ref":"Response"}},"SecurityRequirement":{"description":"Lists the required security schemes to execute this operation. The name used for each property MUST correspond to a security scheme declared in the Security Schemes under the Components Object.  A Security Requirement Object MAY refer to multiple security schemes in which case all schemes MUST be satisfied for a request to be authorized. This enables support for scenarios where multiple query parameters or HTTP headers are required to convey security information.  When the `security` field is defined on the OpenAPI Object or Operation Object and contains multiple Security Requirement Objects, only one of the entries in the list needs to be satisfied to authorize the request. This enables support for scenarios where the API allows multiple, independent security schemes.  An empty Security Requirement Object (`{}`) indicates anonymous access is supported.","type":"object","additionalProperties":{"type":"array","items":{"type":"string"}}},"SecuritySchemes":{"description":"An object to hold reusable Security Scheme Objects.","type":"object","additionalProperties":{"$ref":"SecurityScheme"}},"Server":{"description":"An object representing a Server.","type":"object","properties":{"url":{"type":"string"},"description":{"type":"string"},"variables":{"$ref":"ServerVariables"}}},"ServerVariable":{"description":"An object representing a Server Variable for server URL template substitution.","type":"object","properties":{"enum":{"type":"array","items":{"type":"string"}},"default":{"type":"string"},"description":{"type":"string"}}},"ServerVariables":{"description":"A map between a variable name and its value. The value is used for substitution in the server's URL template.","type":"object","additionalProperties":{"$ref":"ServerVariable"}},"Schemas":{"description":"An object to hold reusable Schema Objects.","type":"object","additionalProperties":{"type":"any"}},"Scopes":{"description":"The available scopes for the OAuth2 security scheme. A map between the scope name and a short description for it.","type":"object","additionalProperties":{"type":"string"}},"SecurityScheme":{"description":"Defines a security scheme that can be used by the operations.  Supported schemes are HTTP authentication, an API key (either as a header, a cookie parameter or as a query parameter), mutual TLS (use of a client certificate), OAuth2's common flows (implicit, password, client credentials and authorization code) as defined in RFC6749, and OpenID Connect Discovery.","type":"object","properties":{"type":{"type":"string"},"description":{"type":"string"},"name":{"type":"string"},"in":{"type":"string"},"scheme":{"type":"string"},"bearerFormat":{"type":"string"},"flows":{"$ref":"OAuthFlows"},"openIdConnectUrl":{"type":"string"}}},"Tag":{"description":"Adds metadata to a single tag that is used by the Operation Object. It is not mandatory to have a Tag Object per tag defined in the Operation Object instances.","type":"object","properties":{"name":{"type":"string"},"description":{"type":"string"},"externalDocs":{"$ref":"ExternalDocs"}}}},"$ref":"OpenAPI"}}